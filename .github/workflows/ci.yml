permissions:
  contents: read
  actions: read
name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $DATA | base64 -di > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Set up keystore for signing
        run: |
          mkdir -p $HOME/.android
          mv keystore.jks $HOME/.android/keystore.jks

      - name: Build and sign APK with Gradle
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      # ---- Delta update (CI channel): diff against the previous successful CI build ----
      - name: Find previous successful CI build
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JSON=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main \
            --event push --status success --limit 5 --json databaseId,headSha || echo '[]')
          RUN=$(echo "$JSON" | jq -r --arg sha "$GITHUB_SHA" \
            '[.[] | select(.headSha != $sha)][0] // empty | "\(.databaseId) \(.headSha)"')
          if [ -z "$RUN" ]; then
            echo "No previous successful CI build found."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_id=${RUN%% *}" >> "$GITHUB_OUTPUT"
          echo "sha=${RUN##* }" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Download previous CI APK
        id: previous_apk
        if: steps.previous.outputs.available == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous
          gh run download "${{ steps.previous.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "app-release-${{ steps.previous.outputs.sha }}" \
            --dir previous

      - name: Generate CI delta patch
        id: ci_delta
        if: steps.previous_apk.outcome == 'success'
        continue-on-error: true
        run: |
          command -v bsdiff >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bsdiff; }
          OLD_APK=$(find previous -name 'Han1meViewer-v*.apk' | head -n 1)
          NEW_APK=$(ls app/build/outputs/apk/release/Han1meViewer-v*.apk | head -n 1)
          bash .github/scripts/make-delta.sh "$OLD_APK" "$NEW_APK" delta-ci
          if [ -f delta-ci/update.json ]; then
            echo "base=$(jq -r '.baseSha256[0:16]' delta-ci/update.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK Zip
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/Han1meViewer-v*.apk

      - name: Upload CI delta package
        if: steps.ci_delta.outputs.base != ''
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ github.sha }}-base-${{ steps.ci_delta.outputs.base }}
          path: |
            delta-ci/update.json
            delta-ci/update.patch

      - name: Extract version from APK
        id: version
        if: contains(github.event.head_commit.message, '[release]')
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/Han1meViewer-v*.apk | head -n 1)
          VERSION=$(basename "$APK_FILE" | sed -E 's/Han1meViewer-(v[0-9.]+)\.apk/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get previous release tag
        id: prev_tag
        if: contains(github.event.head_commit.message, '[release]')
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -n 1)
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        if: contains(github.event.head_commit.message, '[release]')
        env:
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "notes<<EOF"
            if [ -z "$PREV_TAG" ]; then
              RANGE="HEAD"
            else
              RANGE="${PREV_TAG}..HEAD"
            fi
            git log $RANGE --pretty=format:'- %s ([%h](https://github.com/'"$REPO"'/commit/%H))'
            echo ""
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ---- Delta update (Release channel): diff against the previous release APK ----
      - name: Generate release delta patch
        id: release_delta
        if: contains(github.event.head_commit.message, '[release]') && steps.prev_tag.outputs.prev_tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
        run: |
          command -v bsdiff >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bsdiff; }
          mkdir -p previous-release
          gh release download "$PREV_TAG" --repo "${{ github.repository }}" \
            --pattern 'Han1meViewer-v*.apk' --dir previous-release
          OLD_APK=$(find previous-release -name 'Han1meViewer-v*.apk' | head -n 1)
          NEW_APK=$(ls app/build/outputs/apk/release/Han1meViewer-v*.apk | head -n 1)
          bash .github/scripts/make-delta.sh "$OLD_APK" "$NEW_APK" delta-release
          if [ -f delta-release/update.json ]; then
            BASE=$(jq -r '.baseSha256[0:16]' delta-release/update.json)
            ZIP="Han1meViewer-delta-base-${BASE}.zip"
            (cd delta-release && zip -q "$ZIP" update.json update.patch)
            echo "zip=delta-release/$ZIP" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            app/build/outputs/apk/release/Han1meViewer-v*.apk
            ${{ steps.release_delta.outputs.zip }}
          token: ${{ secrets.APP_TOKEN }}

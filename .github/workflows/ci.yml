permissions:
  contents: read
  actions: read
name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 依赖/构建缓存：首次运行写入，之后的运行直接复用（仅 main 分支写入缓存）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$DATA" | base64 -di > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > keystore.jks

      - name: Set up keystore for signing
        run: |
          mkdir -p $HOME/.android
          mv keystore.jks $HOME/.android/keystore.jks

      - name: Build and sign APK with Gradle
        run: ./gradlew assembleRelease --build-cache --parallel
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      # ---- Delta update (CI channel): diff against the last few CI builds + the latest release ----
      # A user who skipped a few CI builds can still update via delta as long as they are on
      # one of these bases. Anyone older falls back to the full APK.
      - name: Find previous successful CI builds
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_DELTA_BUILDS: 3
        run: |
          JSON=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main \
            --event push --status success --limit 15 --json databaseId,headSha || echo '[]')
          echo "$JSON" | jq -r --arg sha "$GITHUB_SHA" --argjson n "$CI_DELTA_BUILDS" \
            '[.[] | select(.headSha != $sha)] | unique_by(.headSha) | .[0:$n][] | "\(.databaseId) \(.headSha)"' \
            > previous-runs.txt || true
          cat previous-runs.txt
          if [ -s previous-runs.txt ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No previous successful CI build found."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download previous CI APKs
        id: previous_apk
        if: steps.previous.outputs.available == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous
          OK=0
          while read -r RUN_ID SHA; do
            [ -n "$RUN_ID" ] || continue
            if gh run download "$RUN_ID" --repo "${{ github.repository }}" \
                 --name "app-release-$SHA" --dir "previous/$SHA"; then
              OK=$((OK + 1))
            else
              echo "Could not download artifact of $SHA (expired?), skipping."
            fi
          done < previous-runs.txt
          [ "$OK" -gt 0 ]

      - name: Download latest release APK
        id: last_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          [ -n "$TAG" ] || { echo "No release found."; exit 1; }
          mkdir -p last-release
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern '*.apk' --dir last-release
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Slots 1-3: previous CI builds (newest first). Slot "release": latest published release.
      - name: Generate CI delta patches
        id: ci_delta
        if: steps.previous_apk.outcome == 'success' || steps.last_release.outcome == 'success'
        continue-on-error: true
        run: |
          command -v bsdiff >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bsdiff; }
          NEW_APK=$(ls app/build/outputs/apk/release/HANiEX-v*.apk | head -n 1)
          SEEN=" "

          # make_one <old apk> <out dir> <output key>
          make_one() {
            local old="$1" out="$2" key="$3" base
            bash .github/scripts/make-delta.sh "$old" "$NEW_APK" "$out" || return 0
            [ -f "$out/update.json" ] || return 0
            base=$(jq -r '.baseSha256[0:16]' "$out/update.json")
            # artifact names must be unique: skip a base that already has a patch
            case "$SEEN" in *" $base "*) echo "base $base already covered"; return 0;; esac
            SEEN="$SEEN$base "
            echo "$key=$base" >> "$GITHUB_OUTPUT"
          }

          if [ "${{ steps.previous_apk.outcome }}" = "success" ]; then
            i=0
            while read -r RUN_ID SHA; do
              [ -n "$SHA" ] || continue
              OLD_APK=$(find "previous/$SHA" -name '*.apk' 2>/dev/null | head -n 1)
              [ -n "$OLD_APK" ] || continue
              i=$((i + 1))
              make_one "$OLD_APK" "delta-ci-$i" "base_$i"
            done < previous-runs.txt
          fi

          if [ "${{ steps.last_release.outcome }}" = "success" ]; then
            OLD_APK=$(find last-release -name '*.apk' | head -n 1)
            [ -z "$OLD_APK" ] || make_one "$OLD_APK" delta-ci-release base_release
          fi

      - name: Upload APK Zip
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/HANiEX-v*.apk
          if-no-files-found: error

      - name: Upload CI delta package (CI build #1 back)
        if: steps.ci_delta.outputs.base_1 != ''
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ github.sha }}-base-${{ steps.ci_delta.outputs.base_1 }}
          path: |
            delta-ci-1/update.json
            delta-ci-1/update.patch

      - name: Upload CI delta package (CI build #2 back)
        if: steps.ci_delta.outputs.base_2 != ''
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ github.sha }}-base-${{ steps.ci_delta.outputs.base_2 }}
          path: |
            delta-ci-2/update.json
            delta-ci-2/update.patch

      - name: Upload CI delta package (CI build #3 back)
        if: steps.ci_delta.outputs.base_3 != ''
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ github.sha }}-base-${{ steps.ci_delta.outputs.base_3 }}
          path: |
            delta-ci-3/update.json
            delta-ci-3/update.patch

      - name: Upload CI delta package (latest release)
        if: steps.ci_delta.outputs.base_release != ''
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ github.sha }}-base-${{ steps.ci_delta.outputs.base_release }}
          path: |
            delta-ci-release/update.json
            delta-ci-release/update.patch

      - name: Extract version from APK
        id: version
        if: contains(github.event.head_commit.message, '[release]')
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/HANiEX-v*.apk | head -n 1)
          VERSION=$(basename "$APK_FILE" .apk | sed -E 's/^HANiEX-//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get previous release tag
        id: prev_tag
        if: contains(github.event.head_commit.message, '[release]')
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -n 1)
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        if: contains(github.event.head_commit.message, '[release]')
        env:
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "notes<<EOF"
            if [ -z "$PREV_TAG" ]; then
              RANGE="HEAD"
            else
              RANGE="${PREV_TAG}..HEAD"
            fi
            git log $RANGE --pretty=format:'- %s ([%h](https://github.com/'"$REPO"'/commit/%H))'
            echo ""
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ---- Delta update (Release channel): diff against the previous release APK ----
      - name: Generate release delta patch
        id: release_delta
        if: contains(github.event.head_commit.message, '[release]') && steps.prev_tag.outputs.prev_tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
        run: |
          command -v bsdiff >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bsdiff; }
          mkdir -p previous-release
          gh release download "$PREV_TAG" --repo "${{ github.repository }}" \
            --pattern '*.apk' --dir previous-release
          OLD_APK=$(find previous-release -name '*.apk' | head -n 1)
          NEW_APK=$(ls app/build/outputs/apk/release/HANiEX-v*.apk | head -n 1)
          bash .github/scripts/make-delta.sh "$OLD_APK" "$NEW_APK" delta-release
          if [ -f delta-release/update.json ]; then
            BASE=$(jq -r '.baseSha256[0:16]' delta-release/update.json)
            ZIP="HANiEX-delta-base-${BASE}.zip"
            (cd delta-release && zip -q "$ZIP" update.json update.patch)
            echo "zip=delta-release/$ZIP" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            app/build/outputs/apk/release/HANiEX-v*.apk
            ${{ steps.release_delta.outputs.zip }}
          token: ${{ secrets.APP_TOKEN }}
